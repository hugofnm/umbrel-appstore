version: "3.7"

services:
  server:
    image: mbentley/omada-controller:6.3-arm64@sha256:34efd215c3b1bcbc7b442f717f6b4ddb44ceddf376fca330e75d4cd8f95bdd55
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host # host network mode required for device discovery
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      - PUID=1000
      - PGID=1000
      - MANAGE_HTTP_PORT=8068
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8068
      - PORTAL_HTTPS_PORT=8843
      - WEB_CONFIG_OVERRIDE=true
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/tplink/EAPController/data
      - ${APP_DATA_DIR}/data/logs:/opt/tplink/EAPController/logs