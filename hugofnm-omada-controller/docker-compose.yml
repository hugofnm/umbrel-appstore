version: "3.7"

services:
  server:
    image: mbentley/omada-controller:6.3-arm64@sha256:34efd215c3b1bcbc7b442f717f6b4ddb44ceddf376fca330e75d4cd8f95bdd55
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host # host network mode required for device discovery
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      - PUID=1000
      - PGID=1000
      - MANAGE_HTTP_PORT=8068
      - MANAGE_HTTPS_PORT=18043
      - PORTAL_HTTP_PORT=8068
      - PORTAL_HTTPS_PORT=8843
      - WEB_CONFIG_OVERRIDE=true
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/tplink/EAPController/data
      - ${APP_DATA_DIR}/data/logs:/opt/tplink/EAPController/logs

  proxy:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    network_mode: host # Omada only listens on the host network
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
        }
        server {
          listen 8043;
          client_max_body_size 0;
          location / {
            proxy_pass https://127.0.0.1:18043;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_redirect ~^https?://[^/]+:18043/(.*)$$ /$$1;
            proxy_read_timeout 1h;
          }
        }
        EOF
        exec nginx -g 'daemon off;'